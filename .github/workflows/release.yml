name: Release APK
run-name: "Release • ${{ github.ref_name }}"

# Fork: a v* tag builds a release APK signed with the fork's key and
# publishes it as a GitHub Release. Pushes to branches only build a debug APK.
on:
  push:
    tags: ["v*"]
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - uses: gradle/actions/setup-gradle@v4

    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools

    - name: Unit tests
      run: ./gradlew --no-daemon :tunnel:testDebugUnitTest

    - name: Build debug APK
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: ./gradlew --no-daemon assembleDebug

    - name: Decode keystore
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [[ -z "${KEYSTORE_B64}" ]]; then
          echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
          exit 1
        fi
        echo "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/release.p12"
        echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.p12" >> "$GITHUB_ENV"

    - name: Build signed release APK
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        KEY_ALIAS: release
      run: |
        set -euo pipefail
        ./gradlew --no-daemon assembleRelease
        mkdir -p out
        cp ui/build/outputs/apk/release/ui-release.apk "out/amneziawg-autoconnect-${GITHUB_REF_NAME}.apk"

    - name: Publish release
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${GITHUB_REF_NAME}" out/*.apk \
          --title "${GITHUB_REF_NAME}" \
          --notes "AmneziaWG with auto-connect on app launch (Settings → Connect on app launch)."

    - name: Upload debug APK
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: ui/build/outputs/apk/debug/ui-debug.apk
